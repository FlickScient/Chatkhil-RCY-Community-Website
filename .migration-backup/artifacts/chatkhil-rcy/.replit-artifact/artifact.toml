kind = "web"
previewPath = "/import-backup/"
title = "Chatkhil RCY Community"
description = "A bilingual community website and administration system for the Red Crescent Youth Unit of Chatkhil Panchgaon Mahbub Government College."
version = "1.0.0"
id = "artifacts/chatkhil-rcy"
router = "path"

[[services]]
name = "web"
paths = [ "/import-backup/" ]
localPort = 21295

[services.development]
run = "pnpm --filter @workspace/chatkhil-rcy run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/chatkhil-rcy", "run", "build" ]
serve = "static"
publicDir = "artifacts/chatkhil-rcy/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/import-backup/index.html"

[services.env]
PORT = "21295"
BASE_PATH = "/import-backup/"
